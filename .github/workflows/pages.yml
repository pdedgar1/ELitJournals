# Rebuilds the explorer from the vault on every push to main, then publishes it to GitHub Pages.
# One-time setup: repo Settings → Pages → Source: "GitHub Actions".
name: Build & deploy explorer

on:
  push:
    branches: [main]
  workflow_dispatch:        # lets you run it by hand from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build site from vault
        run: python3 build_graph.py --out _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
