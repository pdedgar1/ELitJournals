<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>E-Lit Borderlands</title>
  <meta name="description" content="An explorer for P.D. Edgar's network map of electronic literature venues, conferences, and contributors.">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header id="topbar">
    <a id="home" href="#" title="Back to the introduction">E-Lit <em>Borderlands</em></a>
    <div id="search-wrap">
      <input id="search" type="search" placeholder="Search venues and people…" autocomplete="off" aria-label="Search">
      <ul id="results" role="listbox" hidden></ul>
    </div>
    <button id="toggle-panel" class="icon-btn" title="Show / hide reading panel" aria-label="Toggle panel">☰</button>
  </header>

  <main>
    <!-- Block: reading panel (README, notes, people) -->
    <aside id="panel" aria-live="polite">
      <nav id="crumbs"></nav>
      <article id="reader"><p class="muted">Loading the map…</p></article>
    </aside>

    <!-- Block: graph + controls -->
    <section id="graph-wrap">
      <div id="graph"></div>
      <div id="controls">
        <div id="legend"></div>
        <label class="ctl"><input type="checkbox" id="show-people" checked> Bridge people</label>
        <label class="ctl" title="Only show people who appear in at least this many venues">
          Min venues <input type="range" id="min-venues" min="2" max="12" value="2"> <output id="min-venues-out">2</output>
        </label>
        <button id="layout-btn" class="ctl-btn">Pause layout</button>
        <button id="fit-btn" class="ctl-btn">Recenter</button>
      </div>
      <div id="loading">Arranging the borderlands…</div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/graphology@0.26.0/dist/graphology.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/graphology-library@0.8.0/dist/graphology-library.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sigma@3.0.3/dist/sigma.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked@18.0.14/lib/marked.umd.js"></script>
  <script src="app.js"></script>
</body>
</html>
